name: ci

on: [push, pull_request]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    runs-on: ubuntu-24.04
    # The bindings are generated from Qt 6.12 headers (spec/ir) and need Qt
    # 6.12 or newer; Ubuntu's packages are older, Arch tracks current Qt.
    container: archlinux:latest
    strategy:
      matrix:
        mode: [test, debug, asan, cgocheck2, generate]
    steps:
      - name: Qt 6, compiler and tools
        run: pacman -Syu --noconfirm --needed qt6-base gcc pkgconf mesa git ttf-dejavu
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Qt version
        run: pkg-config --modversion Qt6Core
      - name: test
        if: matrix.mode == 'test'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go run ./cmd/qute vet ./examples/...
          go test ./...
      - name: debug build (call sites, rule 5, named thread checks)
        if: matrix.mode == 'debug'
        run: go test -tags qute_debug ./...
      - name: AddressSanitizer and LeakSanitizer
        if: matrix.mode == 'asan'
        run: LSAN_OPTIONS=suppressions=$PWD/lsan.supp go test -asan . ./qtcore ./qtgui ./qtwidgets ./qtopengl ./qtopenglwidgets
      - name: strict cgo pointer checks
        if: matrix.mode == 'cgocheck2'
        run: GOEXPERIMENT=cgocheck2 go test . ./qtcore ./qtgui ./qtwidgets ./qtopengl ./qtopenglwidgets
      - name: generated code is up to date
        if: matrix.mode == 'generate'
        # git status also catches new untracked files the generator wrote
        run: |
          go generate ./qtcore
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }
