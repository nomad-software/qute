name: ci

on: [push, pull_request]

env:
  QT_QPA_PLATFORM: offscreen

jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        mode: [test, debug, asan, cgocheck2, generate]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Qt 6
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev libqt6opengl6-dev libgl1-mesa-dri pkg-config
      - name: test
        if: matrix.mode == 'test'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go run ./cmd/qute vet ./examples/...
          go test ./...
      - name: debug build (thread checks, call sites)
        if: matrix.mode == 'debug'
        run: go test -tags qute_debug ./...
      - name: AddressSanitizer and LeakSanitizer
        if: matrix.mode == 'asan'
        run: LSAN_OPTIONS=suppressions=$PWD/lsan.supp go test -asan . ./qtcore ./qtgui ./qtwidgets ./qtopengl ./qtopenglwidgets
      - name: strict cgo pointer checks
        if: matrix.mode == 'cgocheck2'
        run: GOEXPERIMENT=cgocheck2 go test . ./qtcore ./qtgui ./qtwidgets ./qtopengl ./qtopenglwidgets
      - name: generated code is up to date
        if: matrix.mode == 'generate'
        # git status also catches new untracked files the generator wrote
        run: |
          go generate ./qtcore
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # macOS and Windows support comes later: these jobs are kept but do not
  # fail the build until that work starts.
  macos:
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - run: brew install qt pkg-config
      - run: go test ./...

  windows:
    runs-on: windows-2022
    continue-on-error: true
    defaults:
      run: { shell: "msys2 {0}" }
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-go mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-pkgconf
      - run: go test ./...
