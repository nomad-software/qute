# Ownership overlays for qtwidgets.
#
# Rules for args: transfer-to-cpp (Qt frees it from now on), transfer-to-go
# (Go frees it), transfer-this (the receiver is parented to the arg, or Owned
# when nil), borrowed (no change), scoped (valid only during a callback).
# Rules for return: transfer-to-go, parented, borrowed.
#
# Keys are method names (all overloads) or signatures, e.g. "resize(const QSize&)".
# Every transfer rule gets a generated test in qtwidgets/ownership_gen_test.go.

