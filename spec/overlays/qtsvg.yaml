# Ownership overlays for qtsvg. See spec/overlays/qtwidgets.yaml for the rules.

QSvgRenderer:
  render: { reviewed: true, doc: "The renderer paints through the painter during the call only." }

QSvgGenerator:
  setOutputDevice: { args: { outputDevice: keep:device }, reviewed: true, doc: "The generator does not take ownership of the device; it keeps the device from being garbage collected." }
  outputDevice: { return: borrowed }
