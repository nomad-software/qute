QLoggingCategory:
  QLoggingCategory:
    # Qt keeps the pointer (it expects a string literal), and the Go string's C copy is freed after the
    # call: each distinct name is interned once, for the life of the program
    cpp: "[&] { static QSet<QByteArray> *names = new QSet<QByteArray>; return new $class(names->insert(QByteArray($0))->constData()); }()"
    doc: "Qt keeps the category name for the life of the program, so each distinct name is stored once and never freed."
    test: |
      a := qtcore.NewQLoggingCategoryWithCategory("qute.test.names")
      b := qtcore.NewQLoggingCategoryWithCategory("qute.test.names")
      if a.CategoryName() != "qute.test.names" || b.CategoryName() != "qute.test.names" {
      	t.Errorf("category names %q and %q", a.CategoryName(), b.CategoryName())
      }
      a.Delete()
      if b.CategoryName() != "qute.test.names" {
      	t.Errorf("name %q after a category of the same name was deleted", b.CategoryName())
      }
      b.Delete()
  defaultCategory: { return: borrowed, reviewed: true, doc: "The default category is a static object that lives as long as the program." }
