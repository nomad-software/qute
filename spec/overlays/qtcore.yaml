QConcatenateTablesProxyModel:
  sourceModels: { return: borrowed }
  addSourceModel: { args: { sourceModel: keep-each }, reviewed: true, doc: "The proxy does not take ownership of the source model; it keeps it from being garbage collected until RemoveSourceModel." }
  removeSourceModel:
    args: { sourceModel: release }
    reviewed: true
    # Qt indexes its list with the model's position unchecked: removing a model that is not a source crashes
    cpp: "[&] { if ($self->sourceModels().contains($0)) $self->removeSourceModel($0); }()"
    doc: "A model that is not a source of the proxy is ignored."
    test: |
      p := qtcore.NewQConcatenateTablesProxyModel(nil)
      m := qtcore.NewQStringListModelWithStrings([]string{"a", "b"}, nil)
      p.RemoveSourceModel(m) // not a source: ignored
      p.AddSourceModel(m)
      if p.RowCount() != 2 {
      	t.Errorf("rows %d, want 2", p.RowCount())
      }
      p.RemoveSourceModel(m)
      if p.RowCount() != 0 || len(p.SourceModels()) != 0 {
      	t.Errorf("after RemoveSourceModel: rows %d, sources %d", p.RowCount(), len(p.SourceModels()))
      }
      if rt.KeepsArg(unsafe.Pointer(p), unsafe.Pointer(m)) {
      	t.Error("source model still kept after RemoveSourceModel")
      }
      p.Delete()
      m.Delete()

