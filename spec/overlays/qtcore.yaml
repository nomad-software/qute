QEvent:
  QEvent: { name: NewQEvent, doc: "A custom event (a type from QEventRegisterEventType, or QEventUser and above) to send or post." }
  clone:
    return: transfer-to-go
    doc: "Returns a new copy; the caller owns it."
    test: |
      e := qtcore.NewQEvent(qtcore.QEventUser)
      c := e.Clone()
      if got := c.Ownership(); got != qtcore.Owned {
      	t.Errorf("clone: %v, want Owned", got)
      }
      if c.Type() != qtcore.QEventUser {
      	t.Errorf("clone type: %v", c.Type())
      }
      c.Delete()
      e.Delete()

