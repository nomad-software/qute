QObjectCleanupHandler:
  add: { args: { object: transfer-to-cpp }, return: borrowed, doc: "The handler deletes the object when the handler is destroyed or Clear is called, unless the object dies first." }
  remove:
    args: { object: transfer-to-go }
    doc: "The handler no longer deletes the object; ownership passes back to the caller."
    test: |
      h := qtcore.NewQObjectCleanupHandler()
      o := qtcore.NewQObject(nil)
      h.Add(o)
      if got := o.Ownership(); got != qtcore.Parented {
      	t.Errorf("after Add: %v, want Parented", got)
      }
      h.Remove(o)
      if got := o.Ownership(); got != qtcore.Owned {
      	t.Errorf("after Remove: %v, want Owned", got)
      }
      h.Delete()
      if !o.Alive() {
      	t.Error("removed object died with the handler")
      }
      o.Delete()

