QCborStreamReader:
  QCborStreamReader(QIODevice*): { args: { device: keep:device }, reviewed: true }
  # Qt reads the pointer forms in place (QByteArray::fromRawData), and the Go slice is only pinned for the call
  QCborStreamReader(const char*, qsizetype): { skip: "use NewQCborStreamReaderWithBytes: the reader would keep reading the caller's memory" }
  QCborStreamReader(const quint8*, qsizetype): { skip: "use NewQCborStreamReaderWithBytes: the reader would keep reading the caller's memory" }
  QCborStreamReader(const QByteArray&):
    name: NewQCborStreamReaderWithBytes
    doc: "The reader works on its own copy of data."
    test: |
      data := []byte{0x65, 'h', 'e', 'l', 'l', 'o'} // the text string "hello"
      r := qtcore.NewQCborStreamReaderWithBytes(data)
      for i := range data {
      	data[i] = 0xff
      }
      if got := r.ReadAllString(); got != "hello" {
      	t.Errorf("read %q after the caller changed its slice, want %q", got, "hello")
      }
      r.Delete()
