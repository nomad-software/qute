# Ownership overlays for qtcore. Rules: transfer-to-cpp, transfer-to-go,
# transfer-this, borrowed, scoped. Keys are method names or signatures.
QIODevice:
  write(const char*, qint64): { skip: "use Write([]byte)" }
  write(const char*): { name: WriteString }
  write(const QByteArray&): { name: Write }
  seek: { name: SeekTo, doc: "Named SeekTo so it does not clash with io.Seeker's signature." }
  getChar: { args: { c: out } }
  readLineInto(QByteArray*, qint64): { args: { result: out } }
QCoreApplication:
  sendPostedEvents: { reviewed: true }
  installTranslator: { reviewed: true, doc: "The application does not take ownership of the translator; keep it alive." }
  removeTranslator: { reviewed: true }
  notify: { reviewed: true }
  instance: { return: borrowed }
  sendEvent: { reviewed: true }
  postEvent: { args: { event: transfer-to-cpp, receiver: borrowed }, doc: "The post event queue takes ownership of the event and deletes it." }
  removePostedEvents: { reviewed: true }
  exit: { keep-defaults: true }
QObject:
  killTimer(Qt::TimerId): { name: KillTimerID }
  setParent: { args: { parent: transfer-this } }
  event: { reviewed: true }
  eventFilter: { reviewed: true }
  installEventFilter: { args: { filterObj: keep-each }, reviewed: true, doc: "The object does not take ownership of the filter; it keeps the filter from being garbage collected until RemoveEventFilter." }
  removeEventFilter: { args: { obj: release }, reviewed: true }
  deleteLater: { doc: "Safe inside signal and event handlers; the object is deleted when control returns to the event loop." }
  children: { return: borrowed }
  parent: { return: borrowed }
QTimer:
  start(std::chrono::milliseconds): { name: StartWithDuration }
  start(int): { name: StartWithInterval }
  start(): { name: Start }
  QTimer(QObject*): { args: { parent: transfer-this } }
  start: { keep-defaults: false }

QAbstractItemModel:
  decodeData: { reviewed: true } # the stream is used during the call only
  encodeData: { reviewed: true } # the stream is used during the call only
  mimeData:
    return: transfer-to-go
    doc: "The default implementation returns a new QMimeData with no parent; the caller (normally QDrag) owns it."
    test: |
      m := qtcore.NewQStringListModelWithStrings([]string{"a"}, nil)
      d := m.MimeData([]*qtcore.QModelIndex{m.Index(0, 0)})
      if d == nil || d.Ownership() != qtcore.Owned {
      	t.Errorf("d: %v, want Owned", d.Ownership())
      }
      d.Delete()
      m.Delete()
  canDropMimeData: { reviewed: true }
  dropMimeData: { reviewed: true }

QAbstractProxyModel:
  setSourceModel: { args: { sourceModel: keep }, reviewed: true, doc: "The proxy does not take ownership of the source model." }
  sourceModel: { return: borrowed }

QChildEvent:
  child: { return: borrowed }

QEvent:
  clone: { return: transfer-to-go, doc: "Returns a new copy; the caller owns it.", test: "skip: event objects cannot be constructed from Go" }

QItemSelectionModel:
  emitSelectionChanged: { name: EmitSelectionChangedBetween, doc: "Emits selectionChanged with the differences between newSelection and oldSelection." }
  "QItemSelectionModel(QAbstractItemModel*)": { args: { model: keep:model } }
  QItemSelectionModel(QAbstractItemModel*, QObject*): { args: { model: keep:model } }
  model: { return: borrowed }
  setModel: { args: { model: keep:model }, reviewed: true }

QModelIndex:
  model: { return: borrowed }

QPersistentModelIndex:
  model: { return: borrowed }

QDate:
  fromString(QStringView, QStringView, QCalendar): { skip: "use the QString overload" }
  fromString(QStringView, QStringView, int, QCalendar): { name: QDateFromStringFormatYearCalendar }
  fromString(const QString&, const QString&, QCalendar): { name: QDateFromStringFormatCalendar }
  fromString(const QString&, QStringView, QCalendar): { skip: "use the QString overload" }
  toString(const QString&): { name: ToStringFormat }
  toString(QStringView): { skip: "use the QString overload" }
  fromString(QStringView, Qt::DateFormat): { skip: "use the QString overload" }
  fromString(const QString&, Qt::DateFormat): { name: QDateFromString }
  fromString(QStringView, QStringView, int): { skip: "use the QString overload" }
  fromString(const QString&, QStringView, int): { skip: "use the QString overload" }
  fromString(const QString&, const QString&, int): { name: QDateFromStringFormat }
  getDate: { args: { year: out, month: out, day: out } }

QDateTime:
  fromString(QStringView, QStringView, QCalendar): { skip: "use the QString overload" }
  fromString(QStringView, QStringView, int, QCalendar): { name: QDateTimeFromStringFormatYearCalendar }
  fromString(const QString&, const QString&, QCalendar): { name: QDateTimeFromStringFormatCalendar }
  fromString(const QString&, QStringView, QCalendar): { skip: "use the QString overload" }
  QDateTime(QDate, QTime, QDateTime::TransitionResolution): { name: NewQDateTimeLocal, doc: "Local time." }
  QDateTime(QDate, QTime, const QTimeZone&, QDateTime::TransitionResolution): { name: NewQDateTimeIn }
  toString(const QString&): { name: ToStringFormat }
  toString(QStringView): { skip: "use the QString overload" }
  fromString(QStringView, Qt::DateFormat): { skip: "use the QString overload" }
  fromString(const QString&, Qt::DateFormat): { name: QDateTimeFromString }
  fromString(QStringView, QStringView, int): { skip: "use the QString overload" }
  fromString(const QString&, QStringView, int): { skip: "use the QString overload" }
  fromString(const QString&, const QString&, int): { name: QDateTimeFromStringFormat }

QTime:
  QTime(int, int, int, int): { name: NewQTimeWithHourMinute }
  toString(const QString&): { name: ToStringFormat }
  toString(QStringView): { skip: "use the QString overload" }
  fromString(QStringView, Qt::DateFormat): { skip: "use the QString overload" }
  fromString(QStringView, QStringView): { skip: "use the QString overload" }
  fromString(const QString&, QStringView): { skip: "use the QString overload" }
  fromString(const QString&, Qt::DateFormat): { name: QTimeFromString }
  fromString(const QString&, const QString&): { name: QTimeFromStringFormat }

QFile:
  open(QIODeviceBase::OpenMode, QFileDevice::Permissions): { name: OpenWithPermissions }
  open(int, QIODeviceBase::OpenMode, QFileDevice::FileHandleFlags): { name: OpenFd }
  decodeName(const char*): { skip: "use the []byte overload" }
  QFile(const QString&): { skip: "use NewQFileWithName(name, nil)" }
  QFile(const QString&, QObject*): { name: NewQFileWithName }

QBuffer:
  QBuffer(QByteArray*, QObject*): { skip: "on purpose: the buffer keeps a pointer to the byte array, which Go cannot keep alive; use NewQBuffer and SetData" }
  setBuffer: { skip: "on purpose: the buffer keeps a pointer to the byte array, which Go cannot keep alive; use SetData" }
  buffer: { skip: "on purpose: the same bytes as Data" }

QSettings:
  QSettings(QSettings::Scope, QObject*): { name: NewQSettingsWithScopeOnly }
  value(QAnyStringView, const QVariant&): { name: ValueOr }
  value(QAnyStringView): { name: Value }

QVariant:
  QVariant(const QStringList&): { name: NewQVariantWithStrings }
  load: { reviewed: true }
  save: { reviewed: true }
  QVariant(QSizeF): { name: NewQVariantWithSizeF }
  QVariant(QPointF): { name: NewQVariantWithPointF }
  QVariant(QRectF): { name: NewQVariantWithRectF }
  QVariant(const QPersistentModelIndex&): { name: NewQVariantWithPersistentIndex }

QLocale:
  toString(int, int, char32_t): { name: ToStringPadded }
  toString(long, int, char32_t): { name: ToStringLongPadded }
  toString(qlonglong, int, char32_t): { name: ToStringInt64Padded }
  toString(qulonglong, int, char32_t): { name: ToStringUint64Padded }
  toString(short, int, char32_t): { name: ToStringInt16Padded }
  toString(uint, int, char32_t): { name: ToStringUintPadded }
  toString(ulong, int, char32_t): { name: ToStringUlongPadded }
  toString(ushort, int, char32_t): { name: ToStringUint16Padded }
  toString(qulonglong): { name: ToStringUint64 }
  toString(int): { name: ToString }
  toString(qlonglong): { name: ToStringInt64 }
  QLocale(QLocale::Language, QLocale::Territory): { name: NewQLocaleWithLanguageTerritory }
  QLocale(QLocale::Language, QLocale::Script, QLocale::Territory): { name: NewQLocaleWithLanguage }

QItemSelectionRange:
  model: { return: borrowed }
  QItemSelectionRange(const QModelIndex&): { name: NewQItemSelectionRangeOf }
  QItemSelectionRange(const QModelIndex&, const QModelIndex&): { name: NewQItemSelectionRangeSpan }

QFileInfo:
  QFileInfo(const QFileDevice&): { name: NewQFileInfoFor, reviewed: true }
  setFile(const QFileDevice&): { name: SetFileFor, reviewed: true }

QBasicTimer:
  start: { reviewed: true }

QDataStream:
  QDataStream(QIODevice*): { args: { 0: keep:device }, reviewed: true }
  device: { return: borrowed }
  setDevice: { args: { 0: keep:device }, reviewed: true }
  QDataStream(QByteArray*, QIODeviceBase::OpenMode): { skip: "on purpose: the stream keeps a pointer to the byte array, which Go cannot keep alive; use NewQDataStreamWithIODevice over a QBuffer (NewQBuffer, then Data())" }

QMetaType:
  save: { reviewed: true }
  load: { reviewed: true }

QTimerEvent:
  matches: { reviewed: true }

QCalendarYearMonthDay:
  YearMonthDay(int, int, int): { name: NewQCalendarYearMonthDayWithYear }
