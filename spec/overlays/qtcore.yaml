QSignalMapper:
  setMapping: { reviewed: true }
  setMapping(QObject*, QObject*):
    args: { object: keep-each }
    reviewed: true
    # Qt stores the object as a plain pointer and never forgets it: a destroyed one would be emitted by map()
    cpp: "[&] { $self->setMapping($0, $1); if ($1) QObject::connect($1, &QObject::destroyed, $self, [m = $self](QObject *o) { while (QObject *s = m->mapping(o)) m->setMapping(s, static_cast<QObject *>(nullptr)); }); }()"
    doc: "The mapper does not take ownership of object; it keeps it from being garbage collected while the mapper lives. If the object is destroyed, its senders map to nil."
    test: |
      m := qtcore.NewQSignalMapper(nil)
      s := qtcore.NewQObject(nil)
      o := qtcore.NewQObject(nil)
      m.SetMappingObject(s, o)
      if !rt.KeepsArg(unsafe.Pointer(m), unsafe.Pointer(o)) {
      	t.Error("mapped object is not kept")
      }
      var got []*qtcore.QObject
      m.OnMappedObject(func(object *qtcore.QObject) { got = append(got, object) })
      m.MapWithObject(s)
      o.Delete()
      m.MapWithObject(s) // Qt would emit the dangling pointer
      if len(got) != 2 || got[0] != o || got[1] != nil {
      	t.Errorf("mapped %v, want the object and then nil", got)
      }
      m.Delete()
      s.Delete()
  removeMappings: { reviewed: true }
  mapping: { return: borrowed, reviewed: true }
  map(QObject*): { reviewed: true }

