QClipboard:
  setMimeData:
    args: { data: transfer-to-cpp }
    doc: "The clipboard takes ownership of data."
    test: |
      cb := qtgui.QGuiApplicationClipboard()
      d := qtcore.NewQMimeData()
      cb.SetMimeData(d)
      if got := d.Ownership(); got != qtcore.Parented {
      	t.Errorf("data: %v, want Parented", got)
      }
      cb.SetMimeData(qtcore.NewQMimeData()) // replacing deletes the old data
      if d.Alive() {
      	t.Error("old clipboard data alive after it was replaced")
      }
  mimeData: { return: borrowed }
  text(QString&, QClipboard::Mode): { args: { subtype: in-out }, doc: "subtype is read (the MIME subtype wanted, or empty for any) and set to the subtype found." }

QStandardItemModel:
  appendRow(const QList<QStandardItem*>&): { name: AppendRowItems, args: { items: transfer-to-cpp } }
  appendRow(QStandardItem*): { name: AppendRow, args: { item: transfer-to-cpp } }
  appendColumn: { args: { items: transfer-to-cpp } }
  insertRow(int, const QList<QStandardItem*>&): { name: InsertRowItems, args: { items: transfer-to-cpp } }
  insertRow(int, QStandardItem*): { name: InsertRowItem, args: { item: transfer-to-cpp } }
  insertColumn(int, const QList<QStandardItem*>&): { name: InsertColumnItems, args: { items: transfer-to-cpp } }
  setItem(int, int, QStandardItem*): { name: SetItem, args: { item: transfer-to-cpp } }
  setItem(int, QStandardItem*): { name: SetItemRow, args: { item: transfer-to-cpp } }
  setHorizontalHeaderItem: { args: { item: transfer-to-cpp } }
  setVerticalHeaderItem: { args: { item: transfer-to-cpp } }
  takeItem:
    return: transfer-to-go
    test: |
      m := qtgui.NewQStandardItemModel(nil)
      m.AppendRow(qtgui.NewQStandardItemWithText("a"))
      x := m.TakeItem(0)
      if x == nil || x.Ownership() != qtcore.Owned {
      	t.Errorf("x: %v, want Owned", x.Ownership())
      }
      x.Delete()
      m.Delete()
  takeRow:
    return: transfer-to-go
    test: |
      m := qtgui.NewQStandardItemModel(nil)
      m.AppendRow(qtgui.NewQStandardItemWithText("a"))
      l := m.TakeRow(0)
      if len(l) != 1 {
      	t.Fatalf("got %d items", len(l))
      }
      if l[0] == nil || l[0].Ownership() != qtcore.Owned {
      	t.Errorf("l[0]: %v, want Owned", l[0].Ownership())
      }
      l[0].Delete()
      m.Delete()
  takeColumn:
    return: transfer-to-go
    test: |
      m := qtgui.NewQStandardItemModel(nil)
      m.AppendRow(qtgui.NewQStandardItemWithText("a"))
      l := m.TakeColumn(0)
      if len(l) != 1 {
      	t.Fatalf("got %d items", len(l))
      }
      if l[0] == nil || l[0].Ownership() != qtcore.Owned {
      	t.Errorf("l[0]: %v, want Owned", l[0].Ownership())
      }
      l[0].Delete()
      m.Delete()
  takeHorizontalHeaderItem:
    return: transfer-to-go
    test: |
      m := qtgui.NewQStandardItemModelWithRows(1, 1, nil)
      m.SetHorizontalHeaderItem(0, qtgui.NewQStandardItemWithText("h"))
      x := m.TakeHorizontalHeaderItem(0)
      if x == nil || x.Ownership() != qtcore.Owned {
      	t.Errorf("x: %v, want Owned", x.Ownership())
      }
      x.Delete()
      m.Delete()
  takeVerticalHeaderItem:
    return: transfer-to-go
    test: |
      m := qtgui.NewQStandardItemModelWithRows(1, 1, nil)
