  setData(int, int, int, int, int, int, int, int, CubeMapFace, PixelFormat, PixelType, const void *, const QOpenGLPixelTransferOptions *const): { name: SetRegionCubeFaceData }
  setData(int, int, int, int, int, int, int, int, CubeMapFace, int, PixelFormat, PixelType, const void *, const QOpenGLPixelTransferOptions *const): { name: SetRegionCubeFaceLayersData }
  setCompressedData(int, const void *, const QOpenGLPixelTransferOptions *const): { name: SetCompressedData }
