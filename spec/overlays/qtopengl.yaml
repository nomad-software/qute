  setCompressedData(int, int, int, const void *, const QOpenGLPixelTransferOptions *const): { name: SetCompressedLayerData }
  setCompressedData(int, int, CubeMapFace, int, const void *, const QOpenGLPixelTransferOptions *const): { name: SetCompressedCubeFaceData }
  setCompressedData(int, int, int, CubeMapFace, int, const void *, const QOpenGLPixelTransferOptions *const): { name: SetCompressedCubeFaceLayersData }
  borderColor(float *): { name: BorderColorFloat }
  borderColor(int *): { name: BorderColorInt }
  borderColor(unsigned int *): { name: BorderColorUint }
  setSize: { keep-defaults: true, doc: "Pass 1 for unused dimensions." }
  createTextureView:
    return: transfer-to-go
    doc: "The caller owns the new texture view. Needs OpenGL 4.3 or texture-view support."
    test: |
      fmt := qtgui.NewQSurfaceFormat()
      fmt.SetVersion(4, 3)
      fmt.SetProfile(qtgui.QSurfaceFormatCoreProfile)
      ctx := qtgui.NewQOpenGLContext(nil)
      defer ctx.Delete()
      ctx.SetFormat(fmt)
      surf := qtgui.NewQOffscreenSurfaceWithScreen(nil, nil)
      defer surf.Delete()
      surf.SetFormat(fmt)
      surf.Create()
      if !ctx.Create() || !ctx.MakeCurrent(surf) {
      	t.Skip("no OpenGL 4.3 context available")
      }
      defer ctx.DoneCurrent()
      tex := qtopengl.NewQOpenGLTextureWithTarget(qtopengl.QOpenGLTextureTarget2D)
      defer tex.Delete()
      tex.SetFormat(qtopengl.QOpenGLTextureRGBA8_UNorm)
      tex.SetSize(4, 4, 1)
      tex.AllocateStorage()
      view := tex.CreateTextureView(qtopengl.QOpenGLTextureTarget2D, qtopengl.QOpenGLTextureRGBA8_UNorm, 0, 0, 0, 0)
      if view == nil {
      	t.Skip("this driver does not support texture views")
      }
      if got := view.Ownership(); got != qtcore.Owned {
      	t.Errorf("view: %v, want Owned", got)
      }
      view.Delete()

