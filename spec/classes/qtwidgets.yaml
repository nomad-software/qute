  # Qt makes most layout items itself and frees them with their layout, which
  # qute cannot watch: an item handed out by a layout depends on it (see
  # WrapClassFrom), and on its widget, whose deletion also frees the item.
  # Items built in Go report their death themselves (the subclass shim).
  QLayoutItem: { depends-on: widget, parented-delete: "take it out of its layout with the layout's TakeAt or RemoveItem first, which makes it Owned" }
